name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/release.keystore

      - name: Write signing config to gradle.properties
        run: |
          cat >> android/gradle.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Patch build.gradle with signing config
        run: |
          python3 - <<'PYEOF'
          import re

          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file(MYAPP_RELEASE_STORE_FILE)
                      storePassword MYAPP_RELEASE_STORE_PASSWORD
                      keyAlias MYAPP_RELEASE_KEY_ALIAS
                      keyPassword MYAPP_RELEASE_KEY_PASSWORD
                  }
              }
          """

          # Insert signingConfigs before buildTypes
          content = content.replace('    buildTypes {', signing_block + '    buildTypes {', 1)

          # Add signingConfig line inside release buildType
          content = re.sub(
              r'(buildTypes \{.*?release \{)(.*?)(proguardFiles[^\n]*)',
              lambda m: m.group(1) + m.group(2) + m.group(3) + '\n            signingConfig signingConfigs.release',
              content,
              count=1,
              flags=re.DOTALL
          )

          with open(path, 'w') as f:
              f.write(content)

          print("build.gradle patched successfully")
          PYEOF

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Rename AAB with tag version
        run: |
          mv android/app/build/outputs/bundle/release/app-release.aab \
             android/app/build/outputs/bundle/release/skullking-${{ github.ref_name }}.aab

      - name: Upload AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/bundle/release/skullking-${{ github.ref_name }}.aab
